server:
  port: 9101
spring:
  application:
    name: seata-order-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:33061/seata_order?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: root
    password: 123456

# mybatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wander.entity
  configuration:
    map-underscore-to-camel-case: true

# seata
seata:
  registry:
    type: nacos
    nacos:
      server-addr: localhost:8848
      namespace: "" # 为默认的public
      group: SEATA_GROUP
      application: seata-server
      username: nacos
      password: nacos
  tx-service-group: default_tx_group # 事务组，由他获得TC服务的集群名称
  service:
    vgroup-mapping: # 查看源码
      default_tx_group: default # 事务组与TC服务集群的映射关系
  data-source-proxy-mode: AT
logging:
  level:
    io.seata: info
