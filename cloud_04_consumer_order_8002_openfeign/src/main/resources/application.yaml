# 基于time_based 配置
resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 2
        limit-refresh-period: 1s
        timeout-duration: 1
    instances:
      cloud-provider-payment:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 10s # timelimiter默认限制远程1s，超过1s就会超时异常，配置了降级就走降级逻辑
    instances:
      cloud-provider-payment:
        base-config: default
  thread-pool-bulkhead:
    configs:
      default:
        max-thread-pool-size: 1
        core-thread-pool-size: 1
        queue-capacity: 1
    instances:
      cloud-provider-payment:
        base-config: default
      backendB:
        max-thread-pool-size: 1
        core-thread-pool-size: 1
        queue-capacity: 1
#  bulkhead:
#    configs:
#      default:
#        max-concurrent-calls: 2
#        max-wait-duration: 1s
#    instances:
#      cloud-provider-payment:
#        base-config: default
#      backendB:
#        max-wait-duration: 10ms
#        max-concurrent-calls: 20
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-duration-threshold:
          seconds: 2s
        slow-call-rate-threshold: 30
        sliding-window-type: time_based
        sliding-window-size: 2
        minimum-number-of-calls: 2
        permitted-number-of-calls-in-half-open-state: 2
        wait-duration-in-open-state:
          seconds: 5
        record-exceptions:
          - java.lang.Exception
    instances:
      cloud-provider-payment:
        base-config: default

management:
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      # 采样率(默认为0.1,就是10次会有1次被采样)
      probability: 1.0

# 开启打印OpenFeign接口的日志
logging:
  level:
    com.wander.apis.PaymentFeignAPI: debug