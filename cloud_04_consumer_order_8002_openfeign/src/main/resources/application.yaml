server:
  port: 8002
spring:
  application:
    name: cloud-consumer-openfeign

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: ${spring.application.name}
# 全局OpenFeign超时配置
    openfeign:
      client:
        config:
          default: # 对于全部的进行控制，修改为4s更容易观察现象
            connectTimeout: 30000
            readTimeout: 30000
      # 使用httpclient5
      httpclient:
        hc5:
          enabled: true
      # 开启压缩
      compression:
        request:
          enabled: true
          mime-types: text/xml, application/xml, application/json # 触发数据压缩的类型
          min-request-size: 2048 # 最小触发压缩的大小
        response:
          enabled: true
     # 开启断路器相关能力，开启分组能力
      circuitbreaker:
        enabled: true
        group:
          enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default: # 默认配置
        failure-rate-threshold: 50
        sliding-window-type: count_based
        sliding-window-size: 6
        minimum-number-of-calls: 6
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state:
          seconds: 5
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - java.lang.Exception

    instances:
      cloud-provider-payment:
        base-config: default


# 开启打印OpenFeign接口的日志
logging:
  level:
    com.wander.apis.PaymentFeignAPI: debug